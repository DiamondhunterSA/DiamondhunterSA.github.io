<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DiamondhunterSA 的个人博客，记录学习、思考与日常。">
  <meta name="color-scheme" content="light">
  <title>DiamondhunterSA · 个人博客</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fc; color: #20283b; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.8; }
    .container { width: min(860px, calc(100% - 40px)); margin: auto; }
    header { padding: 28px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { font-weight: 700; color: #20283b; text-decoration: none; }
    a { color: #455bd7; text-underline-offset: 4px; }
    main { padding: 70px 0 90px; }
    .eyebrow { color: #455bd7; font-size: 13px; font-weight: 600; letter-spacing: .12em; }
    h1 { margin: 16px 0 20px; font-size: clamp(32px, 6vw, 52px); line-height: 1.3; letter-spacing: -.03em; }
    .intro { max-width: 600px; margin: 0; font-size: 18px; color: #626d82; }
    section { margin-top: 56px; padding: 28px; border: 1px solid #e1e5f0; border-radius: 16px; background: #fff; }
    h2 { margin: 0 0 12px; font-size: 22px; }
    section p { color: #626d82; margin: 0 0 18px; }
    .button { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #455bd7; color: #fff; text-decoration: none; }
    a:focus-visible { outline: 3px solid #8998ff; outline-offset: 5px; }
    footer { border-top: 1px solid #e1e5f0; padding: 24px 0; color: #626d82; font-size: 14px; }
    @media (max-width: 480px) { header { flex-wrap: wrap; } main { padding-top: 40px; } section { padding: 22px; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="brand" href="./">DiamondhunterSA</a>
      <a href="https://github.com/DiamondhunterSA">GitHub ↗</a>
    </header>
    <main>
      <div class="eyebrow">个人博客 / PERSONAL BLOG</div>
      <h1>你好，欢迎来到我的博客。</h1>
      <p class="intro">这里是 DiamondhunterSA 的个人空间。记录学习、分享思考，也留下日常生活中的点滴。</p>
      <section aria-labelledby="welcome-title">
        <h2 id="welcome-title">从这里开始</h2>
        <p>博客已启程，文章正在准备中。欢迎先到我的 GitHub 看看。</p>
        <a class="button" href="https://github.com/DiamondhunterSA">访问我的 GitHub</a>
      </section>
    </main>
    <footer>© 2026 DiamondhunterSA · 由 GitHub Pages 托管</footer>
  </div>
</body>
</html>
